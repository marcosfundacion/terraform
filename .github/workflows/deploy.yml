name: IaC Deployment

on:
  push:
    branches:
      - prod
      - qa
      - dev
      - dr

# These permissions are needed to allow OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.extract-branch.outputs.branch }}
    steps:
      - name: Extract branch name
        id: extract-branch
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

  call-prerequisites:
    needs: set-environment
    uses: marcosfundacion/pipeline/.github/workflows/init.yml@main
    with:
      branch_name: ${{ needs.set-environment.outputs.branch_name }}
      tf_backend_bucket: 'terraform-backend-644193395689'
      tf_backend_key: 'prueba/tfstate'
      tf_backend_dynamodb_table: 'terraform-backend-lock'
    secrets:
      aws_region: 'us-east-1'
      aws_primary_role_arn: 'arn:aws:iam::754478843459:role/fsfb-arquitectura-despliegue-github'
      aws_target_role_arn: 'arn:aws:iam::644193395689:role/fsfb-arquitectura-dev-role-despliegue'

  call-validation:
    needs: call-prerequisites
    uses: marcosfundacion/pipeline/.github/workflows/plan.yml@main
    secrets:
      aws_region: 'us-east-1'
      aws_primary_role_arn: 'arn:aws:iam::754478843459:role/fsfb-arquitectura-despliegue-github'
      aws_target_role_arn: 'arn:aws:iam::644193395689:role/fsfb-arquitectura-dev-role-despliegue'

  call-deployment:
    needs: call-validation
    uses: marcosfundacion/pipeline/.github/workflows/deploy.yml@main
    secrets:
      aws_region: 'us-east-1'
      aws_primary_role_arn: 'arn:aws:iam::754478843459:role/fsfb-arquitectura-despliegue-github'
      aws_target_role_arn: 'arn:aws:iam::644193395689:role/fsfb-arquitectura-dev-role-despliegue'