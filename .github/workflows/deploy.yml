name: Terraform Deployment Pipeline

# Configuración de triggers
on:
  push:
    branches:
      - prod
      - qa
      - dev
      - dr
    paths-ignore:
      - '.github/workflows/sample-workflow.yml'

# Permiso para solicitar el token JWT para la autenticación OIDC
permissions:
  id-token: write
  contents: read

jobs:
  # Llamada al workflow de prerequisites
  prerequisites:
    uses: marcosfundacion/pipeline/.github/workflows/prerequisites.yml@main
  
  # Llamada al workflow de plan
  planning:
    needs: prerequisites
    uses: marcosfundacion/pipeline/.github/workflows/plan_iac.yml@main
    with:
      principal-role-arn: 'arn:aws:iam::754478843459:role/fsfb-arquitectura-despliegue-github'
      target-role-arn: ${{ 
        github.ref_name == 'prod' && 'arn:aws:iam::699631259047:role/fsfb-arquitectura-prod-role-despliegue' ||
        github.ref_name == 'qa' && 'arn:aws:iam::699631259047:role/fsfb-arquitectura-qa-role-despliegue' ||
        github.ref_name == 'dev' && 'arn:aws:iam::699631259047:role/fsfb-arquitectura-dev-role-despliegue' ||
        github.ref_name == 'dr' && 'arn:aws:iam::699631259047:role/fsfb-arquitectura-dr-role-despliegue'}}
  
  # Llamada al workflow de deploy
  deploy:
    needs: planning
    uses: marcosfundacion/pipeline/.github/workflows/deploy_iac.yml@main
    with:
      principal-role-arn: 'arn:aws:iam::754478843459:role/fsfb-arquitectura-despliegue-github'
      target-role-arn: ${{ 
        github.ref_name == 'prod' && 'arn:aws:iam::699631259047:role/fsfb-arquitectura-prod-role-despliegue' ||
        github.ref_name == 'qa' && 'arn:aws:iam::699631259047:role/fsfb-arquitectura-qa-role-despliegue' ||
        github.ref_name == 'dev' && 'arn:aws:iam::699631259047:role/fsfb-arquitectura-dev-role-despliegue' ||
        github.ref_name == 'dr' && 'arn:aws:iam::699631259047:role/fsfb-arquitectura-dr-role-despliegue'}}
      environment: ${{ github.ref_name }}