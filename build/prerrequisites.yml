version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1  # Change to your desired region
    TF_VAR_region: us-east-1         # Change to your desired region
    ACCOUNT_ID: "699631259047"       # Replace with your target account ID
    ROLE_NAME: "TerraformDeploymentRole"  # Replace with your IAM role name
    TF_VERSION: 1.11.1

phases:
  install:
    runtime-versions:
      python: 3.9  # Specify the Python version if needed
      terraform: 1.11.0  # Specify the Terraform version
    commands:
      - echo "Installing dependencies..."
      - pip install awscli  # Install AWS CLI if not already available
      - curl -LO https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
      - unzip terraform_${TF_VERSION}_linux_amd64.zip
      - mv terraform /usr/local/bin/
      - terraform --version

  pre_build:
    commands:
      - echo "Assuming role in target account..."
      - ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"
      - CREDS=$(aws sts assume-role --role-arn $ROLE_ARN --role-session-name terraform-session)
      - export AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r .Credentials.AccessKeyId)
      - export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r .Credentials.SecretAccessKey)
      - export AWS_SESSION_TOKEN=$(echo $CREDS | jq -r .Credentials.SessionToken)

  build:
    commands:
      - echo "Initializing Terraform..."
      - cd path/to/your/terraform/code  # Change to your Terraform code directory
      - terraform init
      - echo "Planning Terraform changes..."
      - terraform plan
      - echo "Applying Terraform changes..."
      - terraform apply -auto-approve

  post_build:
    commands:
      - echo "Terraform deployment completed."

artifacts:
  files:
    - "**/*"
