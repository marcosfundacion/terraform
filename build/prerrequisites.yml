version: 0.2

env:
  variables:
    BRANCH_NAME: "dev"  # Cambia esta variable según la rama que quieras desplegar (dev, qa, prod, dr)

phases:
  install:
    runtime-versions:
      python: 3.9  # Specify the Python version you need
    commands:
      - echo "Installing Terraform..."
      - curl -LO "https://releases.hashicorp.com/terraform/$(curl -s https://checkpoint-api.hashicorp.com/v1/check/terraform | jq -r .current_version)/terraform_$(curl -s https://checkpoint-api.hashicorp.com/v1/check/terraform | jq -r .current_version)_linux_amd64.zip"
      - unzip terraform_*_linux_amd64.zip
      - mv terraform /usr/local/bin/
      - terraform --version
      - echo "Installing Checkov..."
      - pip install checkov
      - echo "Installing jq..."
      - if command -v yum >/dev/null; then yum install -y jq; elif command -v apt-get >/dev/null; then apt-get update && apt-get install -y jq; else echo "Package manager not found. Please install jq manually."; fi

  pre_build:
    commands:
      - echo "Assuming IAM role..."
      - ROLE_ARN="arn:aws:iam::699631259047:role/TerraformDeploymentRole"  # Replace with your role ARN
      - CREDENTIALS=$(aws sts assume-role --role-arn $ROLE_ARN --role-session-name CodeBuildSession)
      - export AWS_ACCESS_KEY_ID=$(echo $CREDENTIALS | jq -r .Credentials.AccessKeyId)
      - export AWS_SECRET_ACCESS_KEY=$(echo $CREDENTIALS | jq -r .Credentials.SecretAccessKey)
      - export AWS_SESSION_TOKEN=$(echo $CREDENTIALS | jq -r .Credentials.SessionToken)
      - echo "Checking out branch $BRANCH_NAME..."
      - git checkout $BRANCH_NAME
      - echo "Running Checkov for static code analysis..."
      #- checkov -d .  # Adjust the directory as needed

  build:
    commands:
      - echo "Updating terraform vars based on branch..."
      - pwd
      - echo "See files"
      - ls -a
      - if [[ "$BRANCH_NAME" == "prod" ]]; then
          echo "Using prod variables";
          cp ./environments/prod/terraform.tfvars terraform.tfvars;
        elif [[ "$BRANCH_NAME" == "qa" ]]; then
          echo "Using QA variables";
          cp ./environments/qa/terraform.tfvars terraform.tfvars;
        elif [[ "$BRANCH_NAME" == "dev" ]]; then
          echo "Using DEV variables";
          cp ./environments/dev/terraform.tfvars terraform.tfvars;
        elif [[ "$BRANCH_NAME" == "dr" ]]; then
          echo "Using DR variables";
          cp ./environments/dr/terraform.tfvars terraform.tfvars;
        fi
      - zip -r terraform_artifact.zip . -x "environments/*" -x ".git/*"
      - echo "Initializing Terraform..."
      - terraform init
      - echo "Planning Terraform deployment..."
      - terraform plan -out=tfplan
      - echo "Applying Terraform deployment..."
      - terraform apply -auto-approve tfplan

  post_build:
    commands:
      - echo "Terraform deployment completed."
      - echo "Cleaning up..."
      - rm terraform_*_linux_amd64.zip
      - rm -rf .terraform

artifacts:
  files:
    - tfplan
